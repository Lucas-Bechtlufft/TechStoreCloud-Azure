name: CI da API e validacao da infra

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'infra/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restaurar pacotes
        run: dotnet restore src/ProductApi/ProductApi.csproj

      - name: Compilar
        run: dotnet build src/ProductApi/ProductApi.csproj --configuration Release --no-restore

      - name: Publicar
        run: dotnet publish src/ProductApi/ProductApi.csproj --configuration Release --no-build --output ./publish

      - name: Guardar o resultado do build
        uses: actions/upload-artifact@v4
        with:
          name: api-publicada
          path: ./publish

  validar-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Validar o Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
