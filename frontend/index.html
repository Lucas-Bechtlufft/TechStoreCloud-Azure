<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>TechStore Cloud - Cadastro de Produtos</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
  input[name="name"] { flex: 2; min-width: 180px; }
  input[name="description"] { flex: 3; min-width: 180px; }
  button { padding: 6px 14px; background: #2b6cb0; color: white; border: none; border-radius: 4px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; font-size: 14px; }
  .del { background: #c53030; padding: 3px 8px; font-size: 12px; }
  #status { font-size: 13px; color: #888; margin-top: 8px; }
</style>
</head>
<body>

<h1>TechStore Cloud &mdash; Cadastro de Produtos</h1>

<script>
  const API_URL = "http://20.39.129.82:5000/api/products";
</script>

<form id="form-produto">
  <input name="name" placeholder="Nome do produto" required>
  <input name="description" placeholder="Descricao">
  <input name="price" type="number" step="0.01" placeholder="Preco" required>
  <input name="stockQuantity" type="number" placeholder="Estoque" required>
  <button type="submit">Adicionar</button>
</form>

<table>
  <thead>
    <tr><th>Nome</th><th>Descricao</th><th>Preco</th><th>Estoque</th><th></th></tr>
  </thead>
  <tbody id="tabela-produtos"></tbody>
</table>

<div id="status"></div>

<script>
const form = document.getElementById("form-produto");
const tabela = document.getElementById("tabela-produtos");
const status = document.getElementById("status");

async function carregarProdutos() {
  status.textContent = "carregando...";
  try {
    const res = await fetch(API_URL);
    const produtos = await res.json();
    tabela.innerHTML = "";
    produtos.forEach(p => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.name}</td>
        <td>${p.description ?? ""}</td>
        <td>R$ ${Number(p.price).toFixed(2)}</td>
        <td>${p.stockQuantity}</td>
        <td><button class="del" onclick="excluir(${p.id})">excluir</button></td>
      `;
      tabela.appendChild(tr);
    });
    status.textContent = `${produtos.length} produto(s) carregado(s)`;
  } catch (err) {
    status.textContent = "erro ao carregar produtos - confere se a API ta no ar";
    console.error(err);
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = new FormData(form);
  const payload = {
    name: data.get("name"),
    description: data.get("description"),
    price: parseFloat(data.get("price")),
    stockQuantity: parseInt(data.get("stockQuantity"))
  };

  await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  form.reset();
  carregarProdutos();
});

async function excluir(id) {
  if (!confirm("Excluir esse produto?")) return;
  await fetch(`${API_URL}/${id}`, { method: "DELETE" });
  carregarProdutos();
}

carregarProdutos();
</script>

</body>
</html>
